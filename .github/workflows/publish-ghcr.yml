          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare makers-gpu image tags
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${repo}-makers-gpu"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${image}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push makers-gpu image
        uses: docker/build-push-action@v6
        with:
          context: makers-gpu
          file: makers-gpu/.devcontainer/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ needs.publish-base-heavy.outputs.base_heavy_sha_image }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=makers-gpu
          cache-to: type=gha,mode=max,scope=makers-gpu

  publish-base-heavy-cudatoolkit:
    needs: publish-base-heavy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    outputs:

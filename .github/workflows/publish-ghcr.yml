          cache-to: type=gha,mode=max,scope=makers-gpu-cudatoolkit

  publish-base-heavy-llamacpp:
    needs:
      - publish-base-heavy-cudatoolkit
      - resolve-llama-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      base_heavy_llamacpp_sha_image: ${{ steps.vars.outputs.sha_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


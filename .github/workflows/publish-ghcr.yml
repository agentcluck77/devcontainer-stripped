name: Publish GHCR Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: llama.cpp branch, tag, or full commit SHA to build
        required: false
        default: master
        type: string

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-llama-cpp:
    runs-on: ubuntu-latest
    outputs:
      llama_cpp_ref: ${{ steps.resolve.outputs.llama_cpp_ref }}

    steps:
      - name: Resolve llama.cpp ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          repo="https://github.com/ggml-org/llama.cpp.git"
          requested_ref="${{ github.event.inputs.llama_cpp_ref }}"
          if [ -z "${requested_ref}" ]; then
            requested_ref="master"
          fi

          sha="$(git ls-remote "${repo}" "refs/heads/${requested_ref}" | awk '{print $1}' | head -n 1)"
          if [ -z "${sha}" ]; then
            sha="$(git ls-remote "${repo}" "refs/tags/${requested_ref}^{}" | awk '{print $1}' | head -n 1)"
          fi
          if [ -z "${sha}" ]; then
            sha="$(git ls-remote "${repo}" "refs/tags/${requested_ref}" | awk '{print $1}' | head -n 1)"
          fi
          if [ -z "${sha}" ] && [[ "${requested_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            sha="${requested_ref}"
          fi
          if [ -z "${sha}" ]; then
            echo "::error::Could not resolve llama.cpp ref '${requested_ref}' from ${repo}."
            exit 1
          fi

          echo "Resolved llama.cpp ${requested_ref} to ${sha}"
          echo "llama_cpp_ref=${sha}" >> "$GITHUB_OUTPUT"

  publish-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base_sha_image: ${{ steps.vars.outputs.base_sha_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare base image tags
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${repo}-base"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha_image=${image}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/.devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  publish-base-heavy:
    needs: publish-base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      base_heavy_sha_image: ${{ steps.vars.outputs.base_heavy_sha_image }}

    steps:

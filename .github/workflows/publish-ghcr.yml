          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            devcontainer-stripped.llama-cpp.revision=${{ needs.resolve-llama-cpp.outputs.llama_cpp_ref }}
          cache-from: type=gha,scope=base-heavy-llamacpp
          cache-to: type=gha,mode=max,scope=base-heavy-llamacpp


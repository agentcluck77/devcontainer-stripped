        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare base-heavy-nvidia image tags
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${repo}-base-heavy-nvidia"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${image}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push base-heavy-nvidia image
        uses: docker/build-push-action@v6
        with:
          context: base-heavy-nvidia
          file: base-heavy-nvidia/.devcontainer/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ needs.publish-base-heavy.outputs.base_heavy_sha_image }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=base-heavy-nvidia
          cache-to: type=gha,mode=max,scope=base-heavy-nvidia

  publish-makers-gpu:
    needs: publish-base-heavy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      makers_gpu_sha_image: ${{ steps.vars.outputs.sha_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:

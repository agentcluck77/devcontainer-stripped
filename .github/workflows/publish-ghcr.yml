      - name: Prepare base-heavy-cudatoolkit image tags
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${repo}-base-heavy-cudatoolkit"

        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare base-heavy image tags
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${repo}-base-heavy"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "base_heavy_sha_image=${image}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push base-heavy image
        uses: docker/build-push-action@v6
        with:
          context: base-heavy
          file: base-heavy/.devcontainer/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ needs.publish-base.outputs.base_sha_image }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=base-heavy
          cache-to: type=gha,mode=max,scope=base-heavy

  publish-base-heavy-nvidia:

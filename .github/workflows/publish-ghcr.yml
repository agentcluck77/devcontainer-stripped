          context: makers-gpu-llamacpp
          file: makers-gpu-llamacpp/.devcontainer/Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ needs.publish-makers-gpu-cudatoolkit.outputs.makers_gpu_cudatoolkit_sha_image }}
            LLAMA_CPP_REF=${{ needs.resolve-llama-cpp.outputs.llama_cpp_ref }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:main
